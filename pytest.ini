[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
addopts = -q --strict-markers --no-header -rN
markers =
    stage(n): the workshop stage this test belongs to; stage tests are the
        participant-facing ones, listed in the spec's table.
    support: holds the reference solution honest. Not part of the assignment;
        a participant never needs to edit one of these.
    chaos: needs fault injection -- deliberately slow, skipped by test-fast.
    latency: measures wall-clock timing -- skipped by test-fast.
